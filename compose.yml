name: ${COMPOSE_PROJECT_NAME:-rp1-shn}
x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: '5'}
x-app-env: &app-env
  APP_ENV: production
  APP_VERSION: ${RP1_VERSION:-1.0.1}
  AUTH_MODE: session
  DATABASE_URL: postgresql+psycopg://${RP1_APP_USER}:${RP1_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
  WORKER_USER_PUBLIC_ID: 00000000-0000-7000-8000-000000000001
  SERVICE_API_KEY_HMAC_SECRET: ${SERVICE_API_KEY_HMAC_SECRET}
  AUTH_COOKIE_SECURE: 'true'
  CORS_ORIGINS: ${PLATFORM_URL}
services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RP1_APP_USER: ${RP1_APP_USER}
      RP1_APP_PASSWORD: ${RP1_APP_PASSWORD}
      RP1_READONLY_USER: ${RP1_READONLY_USER}
      RP1_READONLY_PASSWORD: ${RP1_READONLY_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 30
    logging: *logging
  migrate:
    image: rp1-shn-migrate:${RP1_VERSION:-1.0.1}
    build: ./database
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RP1_APP_USER: ${RP1_APP_USER}
      RP1_READONLY_USER: ${RP1_READONLY_USER}
      IMPORT_LEGACY_HISTORY: 'false'
    depends_on:
      postgres: {condition: service_healthy}
    restart: 'no'
    logging: *logging
  api:
    image: rp1-shn-api:${RP1_VERSION:-1.0.1}
    build: ./backend
    restart: unless-stopped
    environment:
      <<: *app-env
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_ADMIN_DISPLAY_NAME: 站点系统管理员
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logging
  worker:
    image: rp1-shn-api:${RP1_VERSION:-1.0.1}
    build: ./backend
    restart: unless-stopped
    command: [python, -m, app.services.worker]
    environment: *app-env
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, scripts/check_worker.py]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 4
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logging
  web:
    image: rp1-shn-web:${RP1_VERSION:-1.0.1}
    build: ./frontend
    restart: unless-stopped
    ports: ['${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8443}:8443']
    secrets: [tls-cert, tls-key]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -qO-, 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 5s
      retries: 20
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logging
volumes:
  postgres-data:
secrets:
  tls-cert: {file: ./deployment/secrets/server.crt}
  tls-key: {file: ./deployment/secrets/server.key}
