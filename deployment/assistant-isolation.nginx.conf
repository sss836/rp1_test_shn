pid /tmp/nginx.pid;
events {}
http {
  access_log off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  server {
    listen 8080;
    location = / { default_type text/plain; return 200 "RP1 isolated same-origin gateway\n"; }
    location ^~ /api/v1/assistant/tools/ { return 404; }
    location /api/ {
      proxy_pass http://api:8000;
      proxy_read_timeout 30s;
      proxy_set_header Host $host;
    }
    location = /readyz { proxy_pass http://api:8000/readyz; }
  }
}
