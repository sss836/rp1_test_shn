# Candidate limits. Apply only through an authorized deployment, after workload checks.
services:
  api:
    mem_limit: 2g
    cpus: 2
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
  worker:
    mem_limit: 1g
    cpus: 2
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
  archive-worker:
    mem_limit: 1536m
    cpus: 2
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
